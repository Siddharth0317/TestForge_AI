<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TestForge AI — CI Test Fixture Application</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 360px; }
    h2 { margin-top: 0; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
    button { width: 100%; padding: 0.75rem; background: #4f46e5; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #4338ca; }
    .alert { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.875rem; display: none; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #4ade80; }
    .badge { display: inline-block; font-size: 0.75rem; background: #e0e7ff; color: #3730a3; padding: 0.2rem 0.5rem; border-radius: 4px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">CI Test Infrastructure Only</div>
    <h2>Demo Login</h2>
    
    <div id="alert_box" class="alert"></div>

    <form id="login_form" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="demo_user" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required>
      </div>
      <button id="login_button" type="submit">Log In</button>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const alert = document.getElementById('alert_box');

      if (u === 'valid_user' && p === 'valid_password') {
        alert.className = 'alert alert-success';
        alert.innerText = 'Login successful! Welcome to the secure dashboard.';
        alert.style.display = 'block';
      } else {
        alert.className = 'alert alert-error';
        alert.innerText = 'Invalid username or password.';
        alert.style.display = 'block';
      }
    }
  </script>
</body>
</html>
